<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suivi — Medilink</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Medilink</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="hopitaux.html">Hôpitaux</a></li>
          <li class="nav-item"><a class="nav-link" href="pharmacies.html">Pharmacies</a></li>
          <li class="nav-item"><a class="nav-link active" href="suivi.html">Suivi</a></li>
          <li class="nav-item"><a class="nav-link" href="hopital.html">Espace hôpital</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html">Administration</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Suivi de la demande</h1>
      <p>Envoyée, reçue, en cours de coordination, ou clôturée.</p>
    </div>
  </header>

  <main class="container pb-5">
    <div class="mb-4" style="max-width:28rem">
      <label class="form-label meta" for="request-select">Demande</label>
      <select id="request-select" class="form-select" onchange="Pages.selectTracking(this.value)"></select>
    </div>
    <div id="status-stepper" class="row g-3 mb-4"></div>
    <div class="panel p-3 mb-4">
      <div id="request-details"></div>
    </div>
    <div class="panel p-3">
      <h2 class="h5">Messages</h2>
      <div id="request-messages" class="my-3"></div>
      <div class="input-group">
        <input id="tracking-message" class="form-control" placeholder="Écrire à l’établissement" />
        <button class="btn btn-primary" type="button" onclick="Pages.sendTrackingMessage()">Envoyer</button>
      </div>
      <button class="btn btn-outline-dark btn-sm mt-3" type="button" onclick="Pages.advanceStatus()">Faire avancer le statut</button>
    </div>
  </main>
  <footer class="site-footer"><div class="container">Medilink</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="js/pages.js"></script>
  <script>document.addEventListener("DOMContentLoaded", function () { Pages.initTracking(); });</script>
</body>
</html>
