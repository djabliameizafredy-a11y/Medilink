<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/logo.png" />
  <title>Espace hôpital | Medilink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link href="../css/app.css" rel="stylesheet" />
</head>
<body data-kind="hospital">
  <nav class="navbar">
    <div class="container">
      <span class="navbar-brand"><img src="../assets/logo.png" alt="" width="40" height="39" /><span>Medilink, Espace hôpital</span></span>
      <button id="logout" class="btn btn-sm btn-outline-dark" type="button" hidden>Se déconnecter</button>
    </div>
  </nav>
  <main class="container py-4">
    <section id="login" class="panel p-4" style="max-width:26rem">
      <h1 class="h4">Connexion</h1>
      <p class="meta">Espace réservé au personnel. Les comptes sont créés par Medilink.</p>
      <form id="form" class="d-flex flex-column gap-2">
        <label for="email" class="meta">Adresse e-mail</label>
        <input id="email" class="form-control" type="email" autocomplete="username" required />
        <label for="pw" class="meta">Mot de passe</label>
        <input id="pw" class="form-control" type="password" autocomplete="current-password" required />
        <p id="err" class="meta mb-0" role="alert"></p>
        <button class="btn btn-primary" type="submit">Se connecter</button>
      </form>
    </section>
    <section id="denied" class="panel p-4" hidden><p class="mb-0">Ce compte n’a pas accès à cet espace.</p></section>
    <section id="history" hidden>
      <h1 class="h4">Historique des demandes</h1>
      <p class="meta">Établissement : <strong id="fac"></strong></p>
      <div class="table-responsive"><table class="table">
        <thead><tr><th>Date</th><th>Nom</th><th>Téléphone</th><th>Motif</th><th>Urgence</th><th>Statut</th><th>Code</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/staff.js"></script>
</body>
</html>
